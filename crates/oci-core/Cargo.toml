[package]
name = "oci-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lightweight OCI registry primitives extracted from docker-image-pusher"
authors = ["yorelog <yorelog@gmail.com>"]
repository = "https://github.com/yorelog/docker-image-pusher"

[dependencies]
bytes = "1.11"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "sync", "time"] }
