[package]
name = "docker-image-pusher"
version = "0.5.6"
edition = "2024"
authors = ["yorelog <yorelog@gmail.com>"]
description = "A memory-optimized Docker image transfer tool for handling large images efficiently"
readme = "README.md"
license = "MIT"
keywords = ["docker", "oci", "registry", "streaming", "memory-optimization"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/yorelog/docker-image-pusher"
documentation = "https://github.com/yorelog/docker-image-pusher/blob/main/README.md"

[dependencies]
# Core async runtime with filesystem support
tokio = { version = "1.48", features = ["rt-multi-thread", "fs", "io-util", "macros", "sync", "process"] }

# Futures utilities for concurrent processing
futures = "0.3"

# HTTP client for OCI interactions
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Async IO utilities for streaming file uploads
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1.7"

# Command-line interface 
clap = { version = "4.5.40", features = ["derive"] }

# Error handling
anyhow = "1.0.98"
thiserror = "2.0"

# JSON serialization for manifests and metadata
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# For parsing Docker tar archives
tar = "0.4"
flate2 = "1.1"
tempfile = "3.13"

# For computing file digests
sha2 = "0.10"

# Internal OCI library
oci-core = { version = "0.1", path = "crates/oci-core" }

# Containerd metadata/content reader
containerd-store = { version = "0.1", path = "crates/containerd-store" }

# Minimal Bolt reader for containerd validation
bolt-lite = { version = "0.1", path = "crates/bolt-lite" }

# CLI helpers
which = "8.0"

[dev-dependencies]
assert_cmd = "2.0"



